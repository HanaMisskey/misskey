map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream cluster {
    server misskey-1:3000;
    server misskey-2:3000;
}

server {
    listen 443 ssl;
    server_name cluster.test;

    ssl_certificate /etc/nginx/certificates/cluster.test.crt;
    ssl_certificate_key /etc/nginx/certificates/cluster.test.key;
    ssl_trusted_certificate /etc/nginx/certificates/rootCA.crt;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    # Round-robin load balancer
    location / {
        proxy_pass http://cluster;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Direct access to instance 1 (for targeted testing)
    location /instance-1/ {
        rewrite ^/instance-1/(.*) /$1 break;
        proxy_pass http://misskey-1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Direct access to instance 2 (for targeted testing)
    location /instance-2/ {
        rewrite ^/instance-2/(.*) /$1 break;
        proxy_pass http://misskey-2:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
