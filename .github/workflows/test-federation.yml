name: Test (federation)

on:
  push:
    branches:
      - hanami
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/actions/setup-pgdog/**
      - .github/pgdog/**
      - .github/workflows/test-federation.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/actions/setup-pgdog/**
      - .github/pgdog/**
      - .github/workflows/test-federation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Federation test (${{ matrix.database-route }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database-route: [direct, pgdog]
        node-version-file:
          - .node-version
          - .github/min.node-version
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - name: Build Misskey
        run: |
          pnpm i --frozen-lockfile
          pnpm build
      - name: Setup
        run: |
          echo "NODE_VERSION=$(cat ${{ matrix.node-version-file }})" >> $GITHUB_ENV
          cd packages/backend/test-federation
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key
      - name: Configure PgDog federation route
        if: matrix.database-route == 'pgdog'
        run: |
          cd packages/backend/test-federation
          python3 - <<'PYTHON'
          from pathlib import Path
          for host in ['a.test', 'b.test']:
              path = Path(f'.config/{host}.default.yml')
              text = path.read_text()
              old = f'  host: db.{host}\n'
              if text.count(old) != 1:
                  raise SystemExit(f'Expected database host in {path}')
              path.write_text(text.replace(old, f'  host: pgdog.{host}\n'))
          PYTHON
          echo 'COMPOSE_FILE=compose.yml:compose.override.yaml:compose.pgdog.yml' >> "$GITHUB_ENV"
      - name: Start servers
        id: start_servers
        continue-on-error: true
        # https://github.com/docker/compose/issues/1294#issuecomment-374847206
        run: |
          cd packages/backend/test-federation
          docker compose up -d --scale tester=0
      - name: Print start_servers error
        if: ${{ steps.start_servers.outcome == 'failure' }}
        run: |
          cd packages/backend/test-federation
          docker compose logs | tail -n 300
          exit 1
      - name: Test
        run: |
          cd packages/backend/test-federation
          docker compose run --no-deps tester
      - name: Log
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose logs
      - name: Stop servers
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose down
