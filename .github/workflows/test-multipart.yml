name: Test (multipart upload)

on:
  push:
    branches:
      - hanami
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-multipart.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-multipart.yml
  workflow_dispatch:

jobs:
  # Job 1: Local storage + S3 direct (no staging)
  test-without-staging:
    name: Cluster tests (local + S3 direct)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version

    steps:
      - uses: actions/checkout@v4.3.0
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Setup certificates and config (no staging)
        run: |
          cd packages/backend/test-multipart
          bash setup.sh
          sudo chmod 644 ./certificates/*.key
      - name: Start cluster
        run: |
          cd packages/backend/test-multipart
          docker compose up -d --scale tester=0
      - name: Wait for cluster health
        run: |
          cd packages/backend/test-multipart
          timeout 180 bash -c 'until docker compose ps nginx | grep -q healthy; do sleep 5; echo "Waiting..."; done'
          echo "Cluster is healthy"
      - name: Run tests
        run: |
          cd packages/backend/test-multipart
          docker compose run --no-deps tester
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - name: Collect logs
        if: failure()
        run: |
          cd packages/backend/test-multipart
          docker compose logs misskey-1 misskey-2 nginx > /tmp/cluster-logs-no-staging.txt 2>&1
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-no-staging
          path: /tmp/cluster-logs-no-staging.txt
      - name: Stop cluster
        if: always()
        run: |
          cd packages/backend/test-multipart
          docker compose down

  # Job 2: Staging S3 (R2 → R2)
  test-with-staging:
    name: Cluster tests (staging S3)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ vars.HAS_R2_STAGING == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        node-version-file:
          - .node-version

    steps:
      - uses: actions/checkout@v4.3.0
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Setup certificates and config (with staging)
        run: |
          cd packages/backend/test-multipart
          bash setup.sh
          sudo chmod 644 ./certificates/*.key
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
      - name: Start cluster
        run: |
          cd packages/backend/test-multipart
          docker compose up -d --scale tester=0
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
      - name: Wait for cluster health
        run: |
          cd packages/backend/test-multipart
          timeout 180 bash -c 'until docker compose ps nginx | grep -q healthy; do sleep 5; echo "Waiting..."; done'
          echo "Cluster is healthy"
      - name: Run tests
        run: |
          cd packages/backend/test-multipart
          docker compose run --no-deps tester
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
      - name: Collect logs
        if: failure()
        run: |
          cd packages/backend/test-multipart
          docker compose logs misskey-1 misskey-2 nginx > /tmp/cluster-logs-staging.txt 2>&1
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-staging
          path: /tmp/cluster-logs-staging.txt
      - name: Stop cluster
        if: always()
        run: |
          cd packages/backend/test-multipart
          docker compose down
