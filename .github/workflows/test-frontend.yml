name: Test (frontend)

on:
  push:
    branches:
      - hanami
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/actions/setup-pgdog/**
      - .github/pgdog/**
      - pnpm-lock.yaml
      - .node-version
      - .github/min.node-version
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    branches:
      - hanami
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/actions/setup-pgdog/**
      - .github/pgdog/**
      - pnpm-lock.yaml
      - .node-version
      - .github/min.node-version
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.10
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    strategy:
      fail-fast: false
      matrix:
        database-route: [direct, pgdog]
    name: E2E tests (frontend, ${{ matrix.database-route }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 57712:7700
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: 'development'
          MEILI_MAX_INDEXING_MEMORY: '256Mb'
          MEILI_MAX_INDEXING_THREADS: '2'
      hanamisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 57713:7700
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: 'development'
          MEILI_MAX_INDEXING_MEMORY: '256Mb'
          MEILI_MAX_INDEXING_THREADS: '2'

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.10
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - uses: ./.github/actions/setup-pgdog
      if: matrix.database-route == 'pgdog'
    - name: Build
      run: pnpm build
    - name: Playwright install
      working-directory: packages/frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Test
      run: pnpm start-server-and-test "pnpm --filter backend start:test" http://localhost:61812 "pnpm --filter frontend test:e2e"
      timeout-minutes: 15
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-e2e-artifacts-${{ matrix.database-route }}
        path: packages/frontend/test/e2e/artifacts

    - name: PgDog logs
      if: always() && matrix.database-route == 'pgdog'
      run: docker logs misskey-test-pgdog
